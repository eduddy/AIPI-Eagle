esphome:
  name: m5stick-claw
  friendly_name: M5Stick Claw Node

esp32:
  board: m5stick-c
  framework:
    type: arduino

logger:

api:
  encryption:
    key: "XXXXXXXXXXXXXXXXXXX="

ota:
  - platform: esphome
    password: "XXXXXXXXXXXXXXXXXXX"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Claw Node Fallback Hotspot"
    password: "JFjmkWkpP0ES"

captive_portal:

# POC transport: MQTT. Both boards join the same broker; the AiPi X-Lite
# subscribes to the sensor/binary_sensor state topics published below.
mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: false
  on_connect:
    - rtttl.play: "conn:d=8,o=6,b=180:c,e,g"
  on_disconnect:
    - rtttl.play: "disc:d=8,o=5,b=140:g,e,c"

# BMI270 IMU on the M5StickC Plus2's internal I2C bus
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

# Built-in passive buzzer, used for status/voice-assistant state beeps
# (G2, not G35 - GPIO34-39 on the ESP32 are input-only and can't drive it)
output:
  - platform: ledc
    pin: GPIO2
    id: buzzer_pwm

rtttl:
  id: buzzer
  output: buzzer_pwm

# Built-in SPM1423 PDM microphone (CLK on G0, DATA on G34), used to stream
# push-to-talk audio to Home Assistant's Assist pipeline.
i2s_audio:
  - id: i2s_mic_bus
    i2s_lrclk_pin: GPIO0

microphone:
  - platform: i2s_audio
    id: claw_mic
    i2s_audio_id: i2s_mic_bus
    adc_type: external
    pdm: true
    i2s_din_pin: GPIO34

# No local speaker/media_player here (only a buzzer, no real audio out) -
# the TTS reply URL is forwarded to the AiPi over MQTT (see on_tts_end
# below) so it plays through the AiPi's actual speaker instead.
voice_assistant:
  id: va
  microphone: claw_mic
  use_wake_word: false
  on_listening:
    - rtttl.play: "listen:d=8,o=6,b=180:c"
    - lambda: 'lv_label_set_text(id(va_state_label), "Listening...");'
  on_tts_start:
    - rtttl.play: "reply:d=8,o=6,b=180:e,g"
    - lambda: 'lv_label_set_text(id(va_state_label), "Replying...");'
  on_tts_end:
    - mqtt.publish:
        topic: clawnode/tts_url
        payload: !lambda 'return x;'
  on_end:
    - lambda: 'lv_label_set_text(id(va_state_label), "");'
  on_error:
    - rtttl.play: "err:d=8,o=4,b=120:c,c"
    - lambda: 'lv_label_set_text(id(va_state_label), "Error");'

# Built-in 1.14" ST7789v2 LCD (135x240) - backlight must be switched on
# or the screen stays black even once the display driver is initialized.
switch:
  - platform: gpio
    id: display_backlight
    pin: GPIO27
    restore_mode: ALWAYS_ON

spi:
  clk_pin: GPIO13
  mosi_pin: GPIO15

font:
  - file: "gfonts://Roboto"
    id: status_font
    size: 16

display:
  - platform: mipi_spi
    id: claw_display
    model: ST7789V
    cs_pin: GPIO5
    dc_pin: GPIO14
    reset_pin: GPIO12
    dimensions: 135x240
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never

lvgl:
  widgets:
    - label:
        id: title_label
        align: TOP_MID
        y: 10
        text: "Claw Node"
        text_font: status_font
    - label:
        id: mqtt_status_label
        align: TOP_MID
        y: 50
        text: "MQTT: --"
        text_font: status_font
    - label:
        id: pitch_label
        align: TOP_MID
        y: 90
        text: "Pitch: --"
        text_font: status_font
    - label:
        id: roll_label
        align: TOP_MID
        y: 130
        text: "Roll: --"
        text_font: status_font
    - label:
        id: tap_label
        align: TOP_MID
        y: 170
        text: ""
        text_font: status_font
        text_color: 0xFF3030
    - label:
        id: va_state_label
        align: TOP_MID
        y: 210
        text: ""
        text_font: status_font
        text_color: 0x30C0FF

# Refresh the on-device status readout ~5x/sec.
interval:
  - interval: 200ms
    then:
      - lambda: |-
          lv_label_set_text(id(mqtt_status_label),
              id(mqtt_client)->is_connected() ? "MQTT: connected" : "MQTT: --");
          lv_label_set_text_fmt(id(pitch_label), "Pitch: %.1f", id(node_pitch).state);
          lv_label_set_text_fmt(id(roll_label), "Roll: %.1f", id(node_roll).state);

motion:
  - platform: bmi270
    address: 0x68
    accelerometer_range: 4G
    accelerometer_odr: 100HZ
    gyroscope_range: 2000DPS
    gyroscope_odr: 200HZ

sensor:
  # Orientation angles used to rotate the avatar on the AiPi side.
  # Published to explicit, hand-picked topics (rather than ESPHome's
  # auto-generated name-based topic) so both boards agree on the string.
  - platform: motion
    type: pitch
    name: "Claw Node Pitch"
    id: node_pitch
    on_value:
      then:
        - mqtt.publish:
            topic: clawnode/pitch
            payload: !lambda 'return to_string(x);'
  - platform: motion
    type: roll
    name: "Claw Node Roll"
    id: node_roll
    on_value:
      then:
        - mqtt.publish:
            topic: clawnode/roll
            payload: !lambda 'return to_string(x);'

  # Raw accel axes, kept internal, used only to compute tap magnitude below
  - platform: motion
    type: acceleration_x
    id: accel_x
    internal: true
  - platform: motion
    type: acceleration_y
    id: accel_y
    internal: true
  - platform: motion
    type: acceleration_z
    id: accel_z
    internal: true

  - platform: template
    name: "Claw Node Accel Magnitude"
    id: accel_mag
    internal: true
    update_interval: 20ms
    unit_of_measurement: "g"
    lambda: |-
      float x = id(accel_x).state;
      float y = id(accel_y).state;
      float z = id(accel_z).state;
      return sqrtf(x * x + y * y + z * z);

binary_sensor:
  # Front Button A: hold to talk, release to send to Home Assistant Assist.
  - platform: gpio
    id: button_a
    pin:
      number: GPIO37
      inverted: true
    on_press:
      - voice_assistant.start
    on_release:
      - voice_assistant.stop

  # Software tap detection: a short spike well above resting 1g.
  # Tune the 2.0g threshold to taste once you see real tap data in the MQTT topic.
  - platform: template
    name: "Claw Node Tap"
    id: node_tap
    lambda: |-
      return id(accel_mag).state > 2.0;
    filters:
      - delayed_off: 150ms
    on_press:
      then:
        - mqtt.publish:
            topic: clawnode/tap
            payload: "ON"
        - lambda: 'lv_label_set_text(id(tap_label), "TAP!");'
    on_release:
      then:
        - mqtt.publish:
            topic: clawnode/tap
            payload: "OFF"
        - lambda: 'lv_label_set_text(id(tap_label), "");'
